name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      commit:
        description: The commit on main to check and release, when it is not the head of main.
        required: false

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/checkout@v7
        with:
          repository: the-cascade-protocol/cascade-runtime-js
          ref: main
          path: .runtime-js
          sparse-checkout: scripts
          persist-credentials: false
      - run: npm run build:test
      - run: mkdir -p report
      - run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.runtime-js/scripts/junit-reporter.mjs --test-reporter-destination=report/junit.xml
          "dist/test/**/*.test.js"
      - if: ${{ !cancelled() }}
        run: cp test/spec.json report/spec.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: report/
          if-no-files-found: error

  people:
    runs-on: ubuntu-latest
    outputs:
      vocabulary-commit: ${{ steps.vocabulary.outputs.commit }}
      vocabulary-how: ${{ steps.vocabulary.outputs.how }}
    defaults:
      run:
        working-directory: cascade-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          path: cascade-sandbox
          persist-credentials: false
      - name: The vocabulary at its newest main, or the pull request a Depends-On line names, beside this repository
        id: vocabulary
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/pick@main
        with:
          repository: the-cascade-protocol/cascade-vocabulary
          checkout: cascade-vocabulary
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-sandbox/package-lock.json
      - run: npm ci
      - run: npm run people -- --check

  pack:
    needs: [check, people]
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pack.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          persist-credentials: false
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$(git rev-parse HEAD) is not on main"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: The vocabulary the people were checked against, recorded in the package
        env:
          COMMIT: ${{ needs.people.outputs.vocabulary-commit }}
          HOW: ${{ needs.people.outputs.vocabulary-how }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$COMMIT" ] || { echo "::error::people gave no vocabulary commit"; exit 1; }
          jq -n --arg commit "$COMMIT" --arg how "$HOW" \
            '{repository: "https://github.com/the-cascade-protocol/cascade-vocabulary", commit: $commit, how: $how}' \
            > vocabulary.json
          cat vocabulary.json
      - id: pack
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          npm pkg set "version=0.0.0-commit-$commit"
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          tar -xzOf "$RUNNER_TEMP"/package/*.tgz package/vocabulary.json > /dev/null
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  release:
    needs: pack
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: package
      - env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.pack.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-$COMMIT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is a release already"
            exit 0
          fi
          file=$(ls package/*.tgz)
          gh release create "$tag" "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "$tag" \
            --notes "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$file")" \
            --prerelease \
            --latest=false
