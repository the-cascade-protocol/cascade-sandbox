name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/checkout@v7
        with:
          repository: the-cascade-protocol/cascade-runtime-js
          ref: main
          path: .runtime-js
          sparse-checkout: scripts
          persist-credentials: false
      - run: npm run build:test
      - run: mkdir -p report
      - run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.runtime-js/scripts/junit-reporter.mjs --test-reporter-destination=report/junit.xml
          "dist/test/**/*.test.js"
      - if: ${{ !cancelled() }}
        run: cp test/spec.json report/spec.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: report/
          if-no-files-found: error

  people:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cascade-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-sandbox
          persist-credentials: false
      - name: The vocabulary at its newest main, or the pull request a Depends-On line names, beside this repository
        id: vocabulary
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/pick@main
        with:
          repository: the-cascade-protocol/cascade-vocabulary
          checkout: cascade-vocabulary
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-sandbox/package-lock.json
      - run: npm ci
      - name: The check at the picked commit, with the command as it stands
        env:
          COMMIT: ${{ steps.vocabulary.outputs.commit }}
        run: node -e 'const f = "vocabulary.json"; const v = JSON.parse(fs.readFileSync(f, "utf8")); v.commit = process.env.COMMIT; fs.writeFileSync(f, JSON.stringify(v))'
      - run: npm run people -- --check ../cascade-vocabulary
